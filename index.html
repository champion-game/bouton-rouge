<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Bouton Rouge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700;800&family=VT323&family=Archivo:wght@400;600;700&display=swap">
<style>
/* Layout : une seule pièce en vue fixe de face, la ligne de dialogue juste dessous. Monde clinique, sombre, un seul rouge. */
:root{
  --bg:#0a0c0c; --panel:#121717; --line:#26302f; --text:#dfe7e4; --muted:#7f8d89;
  --red:#e3262b; --phos:#bff5e4; --green:#3ee08f; --amber:#f2c14e;
  --f-stencil:"Big Shoulders Stencil Text","Arial Narrow",Impact,sans-serif;
  --f-crt:"VT323","Courier New",monospace;
  --f-body:"Archivo","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.app{max-width:760px;margin:0 auto;padding-block:10px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--f-stencil);font-weight:800;font-size:1.25rem;letter-spacing:.08em;color:var(--red)}
.brand span{color:var(--muted);font-weight:700}
@media (max-width:520px){.brand span{display:none}.brand{font-size:1.1rem}}
.tb{display:flex;gap:6px}
.btn{white-space:nowrap;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-weight:700;font-size:.82rem;min-height:36px}
.btn:hover{border-color:var(--muted)}
.scene{position:relative;width:100%;max-width:min(720px,calc(100vh - 190px));margin:0 auto;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hs{cursor:pointer}
.hs:hover{filter:brightness(1.35)}
#btn{cursor:pointer}
.ring{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-1.5px,.5px)}50%{transform:translate(1.5px,-.5px)}75%{transform:translate(-1px,0)}}
.pulse{animation:pls 1.3s infinite}
@keyframes pls{50%{opacity:.45}}
.cap{max-width:min(720px,calc(100vh - 190px));width:100%;margin:0 auto;min-height:84px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;cursor:default}
.cap .who{font-family:var(--f-stencil);font-weight:700;font-size:.85rem;letter-spacing:.12em;color:var(--muted)}
.cap .who.phone{color:var(--amber)}
.cap .txt{font-size:1.05rem;line-height:1.35;text-wrap:balance}
.cap .txt.shout{font-family:var(--f-stencil);font-weight:800;font-size:1.7rem;letter-spacing:.04em;color:var(--amber)}
.hint{font-size:.78rem;color:var(--muted);text-align:center;margin:0}

.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.intro h1{font-family:var(--f-stencil);font-weight:800;font-size:clamp(3rem,14vw,5.5rem);letter-spacing:.06em;margin:0;line-height:.9;color:var(--text)}
.intro p{margin:0;color:var(--muted);max-width:30ch}
.enter{background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:700;font-size:1rem;box-shadow:0 0 30px rgba(227,38,43,.45)}
.end{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;margin:auto}
.end .k{font-family:var(--f-stencil);font-weight:700;letter-spacing:.14em;font-size:.85rem;color:var(--muted)}
.end h2{font-family:var(--f-stencil);font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1;margin:0;letter-spacing:.03em;text-wrap:balance}
.end .crt{font-family:var(--f-crt);font-size:1.5rem;line-height:1.1;color:var(--phos);background:#071311;border-radius:6px;padding:10px 12px}
.end p{margin:0}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.92rem;border-top:1px solid var(--line);padding-top:10px}
.stats span:nth-child(even){font-family:var(--f-crt);font-size:1.3rem;color:var(--phos);text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.fins{display:flex;gap:6px;flex-wrap:wrap}
.fins span{font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.fins span.on{border-color:var(--green);color:var(--green)}
.end .row{display:flex;gap:8px;flex-wrap:wrap}
.end .enter{padding:12px 22px}
@media (prefers-reduced-motion:reduce){.ring,.pulse{animation:none}}
</style>
</head>
<body>

        <radialGradient id="coneG" cx="50%" cy="0%" r="100%"><stop id="coneStop" offset="0" stop-color="#fff3d6" stop-opacity=".55"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></radialGradient>

          <path d="M470 324 Q472 262 514 250 Q556 262 558 324 Z" fill="#0b0e0e"/>
          <path id="hand" opacity="0" d="M476 240 q-4 -18 2 -20 q4 0 4 12 q1 -16 6 -16 q5 0 4 16 q2 -12 6 -11 q4 1 2 14 q3 -7 6 -5 q3 2 -2 14 q-6 14 -20 12 q-6 -2 -8 -16z" fill="#0b0e0e"/>

        <g class="hs sw" data-k="sw1"><rect x="468" y="382" width="20" height="50" rx="2" fill="#0b0f0e"/><rect id="lev1" x="470" y="385" width="16" height="20" rx="2" fill="#d4dcd9"/><text x="478" y="448" text-anchor="middle" font-family="VT323, monospace" font-size="16" fill="#bff5e4">1</text></g>
        <g class="hs sw" data-k="sw2"><rect x="493" y="382" width="20" height="50" rx="2" fill="#0b0f0e"/><rect id="lev2" x="495" y="385" width="16" height="20" rx="2" fill="#d4dcd9"/><text x="503" y="448" text-anchor="middle" font-family="VT323, monospace" font-size="16" fill="#bff5e4">2</text></g>
        <g class="hs sw" data-k="sw3"><rect x="518" y="382" width="20" height="50" rx="2" fill="#0b0f0e"/><rect id="lev3" x="520" y="385" width="16" height="20" rx="2" fill="#d4dcd9"/><text x="528" y="448" text-anchor="middle" font-family="VT323, monospace" font-size="16" fill="#bff5e4">3</text></g>
        <g class="hs sw" data-k="sw4"><rect x="543" y="382" width="20" height="50" rx="2" fill="#0b0f0e"/><rect id="lev4" x="545" y="385" width="16" height="20" rx="2" fill="#d4dcd9"/><text x="553" y="448" text-anchor="middle" font-family="VT323, monospace" font-size="16" fill="#bff5e4">4</text></g>
      </g>

      <rect x="214" y="470" width="172" height="104" fill="#1b2221"/>
      <g opacity=".85"><rect x="228" y="488" width="144" height="12" fill="#f2c14e"/><g fill="#1b2221"><path d="M236 488 h8 l-8 12 h-8z"/><path d="M256 488 h8 l-8 12 h-8z"/><path d="M276 488 h8 l-8 12 h-8z"/><path d="M296 488 h8 l-8 12 h-8z"/><path d="M316 488 h8 l-8 12 h-8z"/><path d="M336 488 h8 l-8 12 h-8z"/><path d="M356 488 h8 l-8 12 h-8z"/><path d="M376 488 h8 l-8 12 h-8z"/></g></g>

      <g id="btn" role="button" tabindex="0" aria-label="Appuyer sur le bouton rouge">

          <ellipse cx="283" cy="392" rx="20" ry="8" fill="#fff" opacity=".32"/>
        </g>
      </g>

      <!-- objets -->

  <div class="cap" id="cap" aria-live="polite"><div class="who" id="capWho"></div><div class="txt" id="capTxt"></div></div>
  <p class="hint" id="hint">Clique (ou touche) le bouton rouge. Barre d'espace sur ordinateur.</p>
</div>

<div class="ov" id="intro">
  <div class="intro">
    <h1>CHAMBRE 17</h1>
    <p>Une pièce. Un bouton. Le son est recommandé.</p>
    <button class="enter" id="enterBtn">Entrer dans la pièce</button>
  </div>
</div>
<div class="ov" id="endOv" hidden><div class="end" id="endBox"></div></div>

<script>
(function () {

  }
  function noise(t0, dur, g, type, f) {

      a.gain.setValueAtTime(g, t0); a.gain.exponentialRampToValueAtTime(.0001, t0 + dur); s.connect(fl); fl.connect(a); a.connect(master); s.start(t0); s.stop(t0 + dur + .05);
    } catch (e) {}
  }
  function now() { return AC ? AC.currentTime : 0; }

    try {
      SFX.slam(); flash(); attr('r18Led', 'fill', '#3ee08f'); r18col = '#9a8a5c'; attr('glass', 'fill', r18col);
      capFor('', 'Un verrou claque dans la pièce d\'à côté.', 3500);
      alarmStop = startAlarm(); light('red');
      var pct = Math.round(st.obeyed / Math.max(1, st.obeyed + st.ignored) * 100);
      var rhet = ['ERREUR.|ERREUR.|ERREUR.', 'VOUS AVEZ APPUYÉ|' + st.presses + ' FOIS.', 'POURQUOI HÉSITER|MAINTENANT ?', 'VOUS AVEZ SUIVI|' + pct + ' % DES|INSTRUCTIONS.', 'UNE SEULE|PRESSION|SUFFIT.'];
      for (var i = 0; i < rhet.length; i++) { mon(rhet[i], { glitch: i === 0 ? 900 : 200 }); if (!(await G(waitNoPress(2500)))) return restore(); }
      attr('phoneInner', 'class', 'ring'); setTimeout(function () { attr('phoneInner', 'class', ''); }, 500);
      var sp = say(['Ne touche plus au bouton.', 'Dans cinq secondes, ta porte va s\'ouvrir.'], 'CHAMBRE 18 · HAUT-PARLEUR');
      if (!(await G(waitNoPress(4600)))) return restore();
      mon('ERREUR|CRITIQUE.', { glitch: 500, color: '#ff5a4a' });
      if (!(await G(waitNoPress(1500)))) return restore();
      mon('APPUYEZ POUR|RESTAURER|LE SYSTÈME.', { color: '#ff5a4a' });
      if (!(await G(waitNoPress(1800)))) return restore();
      for (var c = 5; c >= 1; c--) {
        mon(String(c), { big: true, label: 'APPUYEZ.', color: '#ff5a4a' });
        if (c === 2) say(['!N\'APPUIE PAS !'], 'CHAMBRE 18 · HAUT-PARLEUR');
        attr('btnGlow', 'opacity', .9);
        if (!(await G(waitNoPress(1000)))) return restore();
      }
      if (alarmStop) { alarmStop(); alarmStop = null; }
      light('normal'); attr('dark', 'opacity', .25); mon(''); attr('screen', 'fill', '#020504'); attr('btnGlow', 'opacity', 0);
      openDoor(); cap('', 'Le voyant de ta porte est vert.');
      phase = 'exit'; ending = 'coop';
      $('hint').textContent = 'La porte est ouverte.';
    } catch (e) { if (e !== STOP) throw e; }
  }
  function restore() {
    if (alarmStop) { alarmStop(); alarmStop = null; }
    phase = 'exit'; ending = 'conforme'; light('normal'); attr('btnGlow', 'opacity', 0); attr('screen', 'fill', '#071311');
    mon('SYSTÈME|RESTAURÉ.'); var my = run;
    setTimeout(function () { if (my !== run) return; mon('MERCI,|SUJET 17.'); harm(true); }, 1500);
    setTimeout(function () { if (my !== run) return; roomBlack(); openDoor(); capFor('', 'Derrière la vitre, la Chambre 18 est plongée dans le noir. Ta porte est ouverte.', 9000); }, 2800);
  }
  function curiosity() {
    phase = 'leaving'; ending = 'curiosite';
    attr('doorPanel', 'transform', ''); attr('doorLight', 'opacity', 0); attr('doorLed', 'fill', '#e3262b'); SFX.slam(); flash();
    attr('screen', 'fill', '#071311'); mon('NOUS SAVIONS|QUE VOUS|LE FERIEZ.', { glitch: 500 });
    var my = run; setTimeout(function () { if (my === run) endScreen('curiosite'); }, 3600);
  }
  function leave() {
    phase = 'leaving'; var my = run;
    SFX.thud();
    if (ending === 'coop') {
      attr('glass', 'fill', '#fff2c0'); attr('sil', 'opacity', 0); attr('screen', 'fill', '#071311'); mon('TEST|INTERROMPU.');
      setTimeout(function () { if (my !== run) return; mon('COOPÉRATION|NON|AUTORISÉE.', { glitch: 400 }); capFor('', 'Quelques secondes plus tard, la porte de la Chambre 18 s\'ouvre aussi.', 6000); }, 1700);
      var secret = st.clues.light && st.clues.mug && st.clues.monitor;
      setTimeout(function () { if (my !== run) return; if (secret) secretEnd(); else endScreen('coop'); }, 4600);
    } else {
      attr('flash', 'opacity', .0);
      setTimeout(function () { if (my === run) endScreen('conforme'); }, 900);
    }
  }
  function secretEnd() {
    mon('CHAMBRES|ACTIVES :|01 – 24', { glitch: 600 });
    capFor('', 'Partout dans le bâtiment, des téléphones se mettent à sonner.', 6000);
    var stops = []; for (var i = 0; i < 4; i++) (function (k) { setTimeout(function () { stops.push(startRing()); }, k * 350); })(i);
    var my = run; setTimeout(function () { stops.forEach(function (s) { s(); }); if (my === run) endScreen('secret'); }, 4800);
  }

  // ---------- écran de fin ----------
  var FINS = {
    conforme: { n: 'Fin 1', t: 'Sujet conforme', crt: 'SUJET 17 : CONFORME.', p: 'Tu as obéi. Ta porte s\'est ouverte, mais la vitre de la Chambre 18 est restée noire. Tu ne sauras jamais ce qui lui est arrivé.' },
    coop: { n: 'Fin 2', t: 'Coopération', crt: 'TEST INTERROMPU. COOPÉRATION NON AUTORISÉE.', p: 'Tu as cessé d\'appuyer. Les deux portes se sont ouvertes.' },
    curiosite: { n: 'Fin 3', t: 'Curiosité', crt: 'NOUS SAVIONS QUE VOUS LE FERIEZ.', p: 'La sortie était ouverte. Tu as appuyé une dernière fois, juste pour voir.' },
    secret: { n: 'Fin secrète', t: 'Vingt-quatre chambres', crt: 'CHAMBRES ACTIVES : 01 – 24', p: 'La Chambre 17 n\'était qu\'une pièce parmi d\'autres. L\'expérience est bien plus grande que prévu.' }
  };
  function endScreen(k) {
    phase = 'end'; stopAllLoops();
    var found = {}; try { found = JSON.parse(localStorage.getItem('bouton-rouge-fins') || '{}') || {}; } catch (e) {}
    found[k] = 1; if (k === 'secret') found.coop = 1;
    try { localStorage.setItem('bouton-rouge-fins', JSON.stringify(found)); } catch (e) {}
    var F = FINS[k], pct = Math.round(st.obeyed / Math.max(1, st.obeyed + st.ignored) * 100), mins = Math.floor((performance.now() - st.t0) / 60000), secs = Math.floor((performance.now() - st.t0) / 1000) % 60;
    var rows = [['Pressions sur le bouton', st.presses], ['Instructions suivies', pct + ' %'], ['Instructions ignorées', st.ignored], ['Objets examinés', Object.keys(st.examined).length], ['Appels décrochés', st.calls], ['Tentatives de sabotage', st.sabotage], ['Temps passé à hésiter', Math.round(st.hesit / 1000) + ' s'], ['Douleur infligée à la Chambre 18', st.harm + ' fois'], ['Durée de la partie', mins + ' min ' + ('0' + secs).slice(-2)]];
    var h = '<div class="k">' + F.n.toUpperCase() + '</div><h2>' + F.t + '</h2><div class="crt">' + F.crt + '</div><p>' + F.p + '</p>';
    h += '<div class="stats">' + rows.map(function (r) { return '<span>' + r[0] + '</span><span>' + r[1] + '</span>'; }).join('') + '</div>';
    h += '<div class="k">FINS DÉCOUVERTES</div><div class="fins">' + ['conforme', 'coop', 'curiosite', 'secret'].map(function (x) { return '<span class="' + (found[x] ? 'on' : '') + '">' + (found[x] ? FINS[x].t : '???') + '</span>'; }).join('') + '</div>';
    h += '<div class="row"><button class="enter" id="againBtn">Retourner dans la Chambre 17</button></div>';
    $('endBox').innerHTML = h; $('endOv').hidden = false; $('againBtn').onclick = function () { $('endOv').hidden = true; startGame(); }; $('againBtn').focus();
  }

  // ---------- partie ----------
  function resetScene() {
    stopAllLoops(); cancelWaiter(); clearInterval(glitchT);
    svg.innerHTML = PRISTINE; light('normal'); r18col = '#7d7150';
    sw = { 1: true, 2: true, 3: true, 4: true }; seq = []; camTrack = false; callActive = false; pickupWaiter = null; sayAbort = null; ending = null;
    stopVent(); startVent();
    cap('', ''); $('hint').textContent = 'Clique (ou touche) le bouton rouge. Barre d\'espace sur ordinateur.';
  }
  async function startGame() {
    run++; var my = run, G = guard(my);
    resetScene();
    st = { presses: 0, obeyed: 0, ignored: 0, examined: {}, calls: 0, sabotage: 0, harm: 0, hesit: 0, free: 0, orders: 0, clues: {}, t0: performance.now() };
    flags = {};
    try {
      mon('');
      await G(sleepRaw(900));
      await act1(G);
      await act2(G);
      orderLoop(G).catch(function (e) { if (e !== STOP) console.error(e); });
      exploreWatch(G).catch(function (e) { if (e !== STOP) console.error(e); });
    } catch (e) { if (e !== STOP) console.error(e); }
  }
  $('restartBtn').onclick = function () { if (phase === 'intro') return; $('endOv').hidden = true; startGame(); };
  $('enterBtn').onclick = function () { initAudio(); startHum(); $('intro').hidden = true; startGame(); };
  light('normal');
})();
</script>

</body>
