<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Bouton Rouge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700;800&family=VT323&family=Archivo:wght@400;600;700&display=swap">
<style>
/* Layout : la pièce en vue fixe de face ; à droite (ordinateur) ou dessous (téléphone), le chrono, le journal et les choix. */
:root{
  --bg:#0a0c0c; --panel:#121717; --panel2:#182020; --line:#26302f; --text:#dfe7e4; --muted:#8a9894;
  --red:#e3262b; --phos:#bff5e4; --green:#3ee08f; --amber:#f2c14e; --orange:#f2a33a;
  --f-stencil:"Big Shoulders Stencil Text","Arial Narrow",Impact,sans-serif;
  --f-crt:"VT323","Courier New",monospace;
  --f-body:"Archivo","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;padding-block:8px 20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--f-stencil);font-weight:800;font-size:1.2rem;letter-spacing:.08em;color:var(--red);white-space:nowrap}
.brand span{color:var(--muted);font-weight:700}
@media (max-width:520px){.brand span{display:none}.brand{font-size:1.05rem}}
@media (max-width:430px){.brand{font-size:.92rem;letter-spacing:.04em}.tb{gap:4px}.btn{padding:5px 7px;font-size:.72rem;min-height:34px}}
.tb{display:flex;gap:6px}
.btn{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.8rem;min-height:36px}
.btn:hover{border-color:var(--muted)}

.main{display:grid;gap:10px}
@media (min-width:900px){.main{grid-template-columns:minmax(0,1fr) 390px;align-items:start}}
.scene{position:relative;width:100%;max-width:min(100%,calc(100vh - 70px));margin:0 auto;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.scene #scene{position:absolute;inset:0}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hs{cursor:pointer}
.hs:hover{filter:brightness(1.3)}
.ring{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-1.5px,.5px)}50%{transform:translate(1.5px,-.5px)}75%{transform:translate(-1px,0)}}
.pulse{animation:pls 1.3s infinite}
@keyframes pls{50%{opacity:.45}}

.panel{display:flex;flex-direction:column;gap:8px;min-width:0}
.timer{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.35);pointer-events:none;z-index:2}
.timer i{display:block;height:100%;width:100%;background:var(--phos);opacity:.75;transform-origin:left;transition:background .3s}
.timer.low i{background:var(--red);opacity:1}
.paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font-family:var(--f-stencil);font-weight:800;font-size:2rem;letter-spacing:.1em;color:var(--amber);z-index:3}

.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:84px;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px;cursor:pointer}
@media (max-width:899px){.log{max-height:118px}}
@media (min-width:900px){.log{max-height:300px;min-height:160px}}
.log p{margin:0;font-size:.95rem;color:var(--muted)}
.log p.new{color:var(--text)}
.log p.tel{color:var(--amber)}
.log p.ecr{font-family:var(--f-crt);font-size:1.2rem;line-height:1.05;color:var(--phos)}
.log p.me{font-weight:700;color:var(--muted);font-size:.85rem}
.log p.obj{color:var(--green);font-weight:700;font-size:.88rem}

.sheet[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-height:56px}
.sheet.on{border-color:var(--amber)}
.hint{margin:0;color:var(--muted);font-size:.88rem}
.sit{display:flex;flex-direction:column;gap:6px}
.sit + .sit{border-top:1px solid var(--line);padding-top:10px}
.sit .who{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-stencil);font-weight:700;font-size:.85rem;letter-spacing:.12em;color:var(--amber)}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:0 4px;min-height:32px}
.sit p{margin:0;font-size:1rem;text-wrap:pretty}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ch{background:var(--panel2);border:1px solid #3a4644;border-radius:8px;padding:10px;font-weight:700;font-size:.95rem;text-align:left;min-height:46px}
.ch:hover:not(:disabled){border-color:var(--text)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.pockets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:30px}
.pockets .k{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:#56625f}
.pockets button{font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;color:var(--muted);min-height:30px}
.pockets button.flash{border-color:var(--green);color:var(--green)}

.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.intro h1{font-family:var(--f-stencil);font-weight:800;font-size:clamp(3rem,14vw,5.5rem);letter-spacing:.06em;margin:0;line-height:.9}
.intro p{margin:0;color:var(--muted);max-width:34ch}
.enter{background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:700;font-size:1rem;box-shadow:0 0 30px rgba(227,38,43,.45)}
.end{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;margin:auto}
.end .k{font-family:var(--f-stencil);font-weight:700;letter-spacing:.14em;font-size:.85rem;color:var(--muted)}
.end h2{font-family:var(--f-stencil);font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1;margin:0;letter-spacing:.03em;text-wrap:balance}
.end .crt{font-family:var(--f-crt);font-size:1.5rem;line-height:1.1;color:var(--phos);background:#071311;border-radius:6px;padding:10px 12px}
.end p{margin:0}
.end .truth{color:var(--amber)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.92rem;border-top:1px solid var(--line);padding-top:10px}
.stats span:nth-child(even){font-family:var(--f-crt);font-size:1.3rem;color:var(--phos);text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.fins{display:flex;gap:5px;flex-wrap:wrap}
.fins span{font-size:.74rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:#56625f}
.fins span.on{border-color:var(--green);color:var(--green)}
.fins span.cur{background:var(--green);color:#071311}
@media (prefers-reduced-motion:reduce){.ring,.pulse{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">LE BOUTON ROUGE <span>· CHAMBRE 17</span></div>
    <div class="tb"><button class="btn" id="muteBtn" aria-pressed="false">Son : oui</button><button class="btn" id="pauseBtn" aria-pressed="false">Pause</button><button class="btn" id="restartBtn">Recommencer</button></div>
  </header>
  <div class="main">
    <div class="scene" id="sceneWrap"><div class="timer" id="timer" hidden><i id="timerFill"></i></div><div id="scene"></div><div class="paused" id="pausedLbl" hidden>PAUSE</div></div>
    <div class="panel">
      <div class="log" id="log" aria-live="polite" title="Toucher pour accélérer"></div>
      <div class="sheet" id="sheet"></div>
      <div class="pockets" id="pockets"></div>
    </div>
  </div>
</div>

<div class="ov" id="intro">
  <div class="intro">
    <h1>CHAMBRE 17</h1>
    <p>Touche les objets de la pièce pour agir. Ne tarde pas trop : le bouton n'aime pas attendre.</p>
    <p>Le son est recommandé.</p>
    <button class="enter" id="enterBtn">Entrer dans la pièce</button>
  </div>
</div>
<div class="ov" id="endOv" hidden><div class="end" id="endBox"></div></div>

<script src="src/story.js"></script>
<script src="src/engine.js"></script>
<script src="src/audio.js"></script>
<script src="src/room.js"></script>
<script src="src/game.js"></script>
</body>
</html>
