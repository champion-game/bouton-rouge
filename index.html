<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Bouton Rouge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700;800&family=VT323&family=Archivo:wght@400;600;700&display=swap">
<style>
/* Layout : la pièce en vue fixe de face ; à droite (ordinateur) ou dessous (téléphone), le chrono, le journal et les choix. */
:root{
  --bg:#0a0c0c; --panel:#121717; --panel2:#182020; --line:#26302f; --text:#dfe7e4; --muted:#8a9894;
  --red:#e3262b; --phos:#bff5e4; --green:#3ee08f; --amber:#f2c14e; --orange:#f2a33a;
  --f-stencil:"Big Shoulders Stencil Text","Arial Narrow",Impact,sans-serif;
  --f-crt:"VT323","Courier New",monospace;
  --f-body:"Archivo","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-family:var(--f-stencil);font-weight:800;font-size:1rem;letter-spacing:.08em;color:var(--red);white-space:nowrap;opacity:.85}
.brand span{color:var(--muted);font-weight:700}
@media (max-width:520px){.brand span{display:none}.brand{font-size:.9rem}}
.tb{display:flex;gap:5px}
.btn{white-space:nowrap;background:rgba(18,23,23,.8);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-weight:700;font-size:.74rem;min-height:32px}
.btn:hover{border-color:var(--muted)}
/* La pièce occupe tout l'écran ; l'inventaire et l'historique forment une bande en bas. */
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.scene #scene{position:absolute;inset:0}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hud{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));background:#0a0d0d;border-top:1px solid var(--line)}
.hud .bag{flex:0 0 auto;width:min(100%,330px)}
.hud .hist{flex:1 1 220px;min-width:0}
.hs{cursor:pointer}
.hs:hover{filter:brightness(1.3)}
.ring{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-1.5px,.5px)}50%{transform:translate(1.5px,-.5px)}75%{transform:translate(-1px,0)}}
.pulse{animation:pls 1.3s infinite}
@keyframes pls{50%{opacity:.45}}

.timer{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.35);pointer-events:none;z-index:2}
.timer i{display:block;height:100%;width:100%;background:var(--phos);opacity:.75;transform-origin:left;transition:background .3s}
.timer.low i{background:var(--red);opacity:1}
.paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font-family:var(--f-stencil);font-weight:800;font-size:2rem;letter-spacing:.1em;color:var(--amber);z-index:3}
/* Messages courts posés sur la pièce, qui s'effacent seuls */
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(5,8,8,.86);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:.9rem;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
.toast.on{opacity:1}
.toast.obj{color:var(--green);font-weight:700}
.toast.ecr{font-family:var(--f-crt);font-size:1.15rem;color:var(--phos)}
.hintcap{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:rgba(5,8,8,.82);border-radius:6px;padding:5px 10px;text-align:center;font-size:.85rem;color:var(--text);pointer-events:none;z-index:2}

/* Inventaire : 6 cases dessinées */
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1/1;max-height:52px;background:var(--panel);border:1px dashed #222b2a;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px}
.slot svg{width:100%;height:100%}
button.slot{border:1px solid var(--line);cursor:pointer}
button.slot:hover{border-color:var(--muted)}
button.slot.flash{border-color:var(--green);box-shadow:0 0 0 2px rgba(62,224,143,.35)}

/* Historique : une ligne, touchée = tout l'historique */
.hist{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;text-align:left;font-size:.88rem;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:38px}
.hist span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist b{font-size:.7rem;letter-spacing:.1em;color:#56625f}
.histbox{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:4px;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.histbox p,.pop .lines p{margin:0;font-size:.92rem;color:var(--muted)}
.histbox p.tel,.pop .lines p.tel{color:var(--amber)}
.histbox p.ecr{font-family:var(--f-crt);font-size:1.15rem;line-height:1.05;color:var(--phos)}
.histbox p.me{font-weight:700;font-size:.82rem}
.histbox p.obj{color:var(--green);font-weight:700;font-size:.85rem}

/* Popup au centre de l'écran */
/* Popup dans le tiers bas : il ne cache jamais le moniteur ni le bouton. */
.pop{position:fixed;inset:0;z-index:20;background:linear-gradient(to bottom,rgba(0,0,0,0) 35%,rgba(0,0,0,.6));display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:440px;max-height:46vh;overflow:auto;background:var(--panel);border:1px solid #3a4644;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card .who{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-stencil);font-weight:700;font-size:.9rem;letter-spacing:.12em;color:var(--amber)}
.card p{margin:0;font-size:1.02rem;text-wrap:pretty}
.card .lines{display:flex;flex-direction:column;gap:8px}
.card .lines p{font-size:1rem;color:var(--text)}
.card .lines p.sys{font-family:var(--f-crt);font-size:1.15rem;line-height:1.05;color:var(--phos)}
.card .lines p.voix{color:var(--amber);font-style:italic}
.x{background:none;border:0;color:var(--muted);font-size:1.4rem;line-height:1;padding:0 4px;min-height:32px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ch{background:var(--panel2);border:1px solid #3a4644;border-radius:8px;padding:11px 10px;font-weight:700;font-size:.95rem;text-align:left;min-height:48px}
.ch:hover:not(:disabled){border-color:var(--text)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.ch.go{text-align:center;grid-column:1/-1}
.card .sep{border-top:1px solid var(--line)}

.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.intro h1{font-family:var(--f-stencil);font-weight:800;font-size:clamp(3rem,14vw,5.5rem);letter-spacing:.06em;margin:0;line-height:.9}
.intro p{margin:0;color:var(--muted);max-width:34ch}
.intro .ver{font-size:.72rem;color:#56625f;letter-spacing:.06em}
.enter{background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:700;font-size:1rem;box-shadow:0 0 30px rgba(227,38,43,.45)}
.end{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px;margin:auto}
.end .k{font-family:var(--f-stencil);font-weight:700;letter-spacing:.14em;font-size:.85rem;color:var(--muted)}
.end h2{font-family:var(--f-stencil);font-weight:800;font-size:clamp(2rem,8vw,2.8rem);line-height:1;margin:0;letter-spacing:.03em;text-wrap:balance}
.end .crt{font-family:var(--f-crt);font-size:1.5rem;line-height:1.1;color:var(--phos);background:#071311;border-radius:6px;padding:10px 12px}
.end p{margin:0}
.end .truth{color:var(--amber)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.92rem;border-top:1px solid var(--line);padding-top:10px}
.stats span:nth-child(even){font-family:var(--f-crt);font-size:1.3rem;color:var(--phos);text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.fins{display:flex;gap:5px;flex-wrap:wrap}
.fins span{font-size:.74rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:#56625f}
.fins span.on{border-color:var(--green);color:var(--green)}
.fins span.cur{background:var(--green);color:#071311}
@media (prefers-reduced-motion:reduce){.ring,.pulse{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">LE BOUTON ROUGE <span>· CHAMBRE 17</span></div>
    <div class="tb"><button class="btn" id="muteBtn" aria-pressed="false">Son : oui</button><button class="btn" id="pauseBtn" aria-pressed="false">Pause</button><button class="btn" id="restartBtn">Recommencer</button></div>
  </header>
  <div class="main">
    <div class="scene" id="sceneWrap"><div class="timer" id="timer" hidden><i id="timerFill"></i></div><div id="scene"></div><div class="hintcap" id="hintcap" hidden></div><div class="toast" id="toast"></div><div class="paused" id="pausedLbl" hidden>PAUSE</div></div>
    <div class="hud">
      <div class="histbox" id="histBox" hidden></div>
      <div class="bag" id="bag" aria-label="Inventaire"></div>
      <button class="hist" id="histBtn" aria-expanded="false"><b>HISTORIQUE</b><span id="histLast">…</span></button>
    </div>
  </div>
</div>
<div class="pop" id="pop" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<div class="ov" id="intro">
  <div class="intro">
    <h1>CHAMBRE 17</h1>
    <p>Une pièce. Un bouton. Touche ce qui t'entoure.</p>
    <p>Le son est recommandé.</p>
    <button class="enter" id="enterBtn">Entrer dans la pièce</button>
    <p class="ver">Version 2.4 · 18/10</p>
  </div>
</div>
<div class="ov" id="endOv" hidden><div class="end" id="endBox"></div></div>

<script src="src/story.js?v=2.4"></script>
<script src="src/engine.js?v=2.4"></script>
<script src="src/audio.js?v=2.4"></script>
<script src="src/room.js?v=2.4"></script>
<script src="src/game.js?v=2.4"></script>
</body>
</html>
